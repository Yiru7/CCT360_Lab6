<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCT360_Lab6_HomePage</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>

<body>
<header>
    <nav class="navbar md:navbar-expand bg-1 fg-2">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                OffBeat Indie Rock
            </a>

            <button class="btn-icon navbar-toggler"
                type="button"
                data-bs-toggle="drawer"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>

            <dialog class="drawer drawer-end"
                tabindex="-1"
                id="navbarNav"
                aria-labelledby="navbarNavLabel">

                <div class="drawer-header">
                    <h2 class="drawer-title" id="navbarNavLabel">
                        Menu
                    </h2>

                    <button type="button"
                        class="btn-close"
                        data-bs-dismiss="drawer"
                        aria-label="Close menu">
                    </button>
                </div>

                <div class="drawer-body">
                    <ul class="navbar-nav">

                        <li class="nav-item">
                            <a class="nav-link active"
                                aria-current="page"
                                href="index.html">Home</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                                href="index.html#workshops">Discover</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                                href="contact.html">Contact</a>
                        </li>

                    </ul>
                </div>

            </dialog>
        </div>
    </nav>
</header>

<main>

    <section class="container mt-5">

        <h1>Listen beyond Rock</h1>

        <p class="mb-4">
            Discover music that breaks the rules.
            Explore unusual rhythms, experimental sounds,
            and independent artists.
        </p>

        <div id="heroCarousel"
             class="carousel carousel-overlay">

            <div class="carousel-inner rounded-5">

                <div class="carousel-item active">
                    <img src="images/banner1.jpg"
                         class="d-block w-100"
                         alt="Math rock band perform">
                </div>

                <div class="carousel-item">
                    <img src="images/banner2.jpg"
                         class="d-block w-100"
                         alt="Experimental rock performance">
                </div>

                <div class="carousel-item">
                    <img src="images/banner3.jpg"
                         class="d-block w-100"
                         alt="post-rock concert performance">
                </div>

            </div>

            <div class="carousel-overlay-controls">

                <button
                    class="btn-icon btn-sm btn-subtle theme-secondary"
                    type="button"
                    data-bs-target="#heroCarousel"
                    data-bs-slide="prev">

                    <span class="carousel-icon-prev"
                          aria-hidden="true"></span>

                    <span class="visually-hidden">
                        Previous
                    </span>
                </button>

                <button
                    class="btn-icon btn-sm btn-subtle theme-secondary"
                    type="button"
                    data-bs-target="#heroCarousel"
                    data-bs-slide="next">

                    <span class="carousel-icon-next"
                          aria-hidden="true"></span>

                    <span class="visually-hidden">
                        Next
                    </span>
                </button>

            </div>

        </div>

    </section>

</main>

</body>
</html>
